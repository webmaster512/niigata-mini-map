
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="新潟市の観光スポットを地図で確認できるスマートフォン向けデジタルマップです。">
  <title>新潟市 観光 mini MAP</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="site-title">新潟市 観光 mini MAP</div>
    <p>新潟のまちを、地図で楽しもう。</p>
  </header>

  <main>
    <section class="intro">
      <h1>新潟市 観光 mini MAP</h1>
      <p>地図を見ながら、新潟市の観光を楽しみましょう。</p>
      <button id="startButton" type="button">地図を見る</button>
    </section>

    <section id="mapSection" class="map-section" hidden>
      <nav class="map-tabs" aria-label="地図の切り替え">
        <button class="map-tab active" data-map="full" type="button">市内全域</button>
        <button class="map-tab" data-map="center" type="button">中心部</button>
      </nav>

      <div class="map-toolbar">
        <button id="zoomIn" type="button" aria-label="拡大">＋</button>
        <button id="zoomOut" type="button" aria-label="縮小">－</button>
        <button id="resetMap" type="button">全体表示</button>
        <button id="fullscreenButton" type="button">全画面</button>
      </div>

      <div id="map" aria-label="新潟市観光地図"></div>

      <p class="map-note">
        地図は指で動かせます。2本の指で拡大・縮小できます。
      </p>
    </section>
  </main>

  <footer>
    <p>新潟市 観光 mini MAP</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
